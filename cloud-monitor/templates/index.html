<!DOCTYPE html>
<html>
<head>
  <title>Cloud Monitor</title>
  <meta http-equiv="refresh" content="2">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <h1>☁ Cloud Monitoring Dashboard</h1>

  <div class="grid">
    <div class="card">
      <h3>Server</h3>
      <p>{{host}}</p>
    </div>

    <div class="card">
      <h3>Status</h3>
      <p>{{status}}</p>
    </div>

    <div class="card">
      <h3>CPU</h3>
      <p>{{cpu}}%</p>
    </div>

    <div class="card">
      <h3>RAM</h3>
      <p>{{ram}}%</p>
    </div>

    <div class="card">
      <h3>Disk</h3>
      <p>{{disk}}%</p>
    </div>
  </div>

</body>
</html>
